# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
source_url: https://gitlab.wikimedia.org/toolforge-repos/{{ cookiecutter.tool_identifier }}/-/raw/main/toolforge.yaml
components:
  {{ cookiecutter.tool_identifier }}:
    component_type: continuous
    build:
      repository: https://gitlab.wikimedia.org/toolforge-repos/{{ cookiecutter.tool_identifier }}
      ref: main
    run:
      command: web
      mount: none
      port: 8000
      publish: /
      health_check_http: /healthz
